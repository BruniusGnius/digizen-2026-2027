name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Projects/digizen-landing/angular-build/**'
      - 'Projects/digizen-landing-b-v04-claude/output-code/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Un deploy a la vez: si se empujan dos commits seguidos, gana el ultimo.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/digizen-landing/angular-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Projects/digizen-landing/angular-build/package-lock.json

      - run: npm ci

      # base-href tiene que coincidir con la subcarpeta del sitio en Pages.
      - run: npx ng build --configuration production --base-href /digizen-2026-2027/

      - name: Preparar versión B
        run: |
          cd "$GITHUB_WORKSPACE/Projects/digizen-landing-b-v04-claude/output-code"
          python3 scripts/build.py

      - name: Preparar salida para Pages
        run: |
          cd dist/angular-build/browser
          # SPA: cualquier ruta desconocida cae en el index.
          cp index.html 404.html
          # Evita que Pages procese la salida con Jekyll.
          touch .nojekyll

      - name: Publicar en gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/angular-build/browser
          git init -q
          git config user.name 'BruniusGnius'
          git config user.email 'bruno@gnius.club'
          # Conservar vistas históricas; B v04 se reemplaza desde su fuente actual.
          git fetch -q --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:refs/heads/prev
          for d in $(git ls-tree --name-only prev | grep -E '^(b-|codex-)' | grep -v '^b-v04-claude$'); do
            git checkout prev -- "$d"
            echo "Preservada subcarpeta: $d"
          done
          rm -rf b-v04-claude
          cp -R "$GITHUB_WORKSPACE/Projects/digizen-landing-b-v04-claude/output-code" b-v04-claude
          git add -A
          git commit -q -m 'Deploy production build to GitHub Pages'
          # Historia de un solo commit: el sitio pesa >140MB y acumular
          # versiones engordaria el repositorio en cada deploy.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
